# =============================================================================
# DOCKER COMPOSE UNIFICADO — PROYECTO DOPA (DB + Backend FastAPI + pgAdmin + Web)
#
# Uso rápido para conectar el APK Android desde tu celular (misma red Wi-Fi):
#   docker compose up -d --build
#   -> Levanta PostgreSQL 16 (puerto 5432), API FastAPI (puerto 8000) y pgAdmin (5050).
#   -> En el celular abre DOPA, toca "• dopa" arriba a la derecha e ingresa:
#      http://<IP_LOCAL_DE_TU_PC>:8000
#
# Si también deseas levantar la versión Web/PWA en http://localhost:8080:
#   docker compose --profile web up -d --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Base de Datos Relacional: PostgreSQL 16 (persistente con volumen Docker)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dopa_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dopa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dopa_pass}
      POSTGRES_DB: ${POSTGRES_DB:-dopa_db}
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dopa_user} -d ${POSTGRES_DB:-dopa_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dopa_network

  # ---------------------------------------------------------------------------
  # 2. Administrador Visual de Base de Datos: pgAdmin 4 (http://localhost:5050)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dopa_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dopa.app}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "0.0.0.0:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dopa_network

  # ---------------------------------------------------------------------------
  # 3. Backend RESTful en 5 Capas: Python 3.12 + FastAPI + SQLAlchemy
  #    Accesible desde tu celular en: http://<IP_DE_TU_PC>:8000/api/v1
  #    Documentación Swagger en:      http://<IP_DE_TU_PC>:8000/docs
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: dopa_fastapi_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dopa_user}:${POSTGRES_PASSWORD:-dopa_pass}@db:5432/${POSTGRES_DB:-dopa_db}
      DOPA_JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dopa-super-secret-jwt-key-tdah-2026}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dopa-super-secret-jwt-key-tdah-2026}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-nvidia/nemotron-3.5-bolt-e4b}
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dopa_network

  # ---------------------------------------------------------------------------
  # 4. Frontend Flutter Web + Nginx Reverse Proxy (opcional con --profile web)
  # ---------------------------------------------------------------------------
  frontend:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        API_BASE_URL: ${API_BASE_URL:-/api/v1}
        AI_API_BASE_URL: ${AI_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
        AI_API_KEY: ${AI_API_KEY:-}
        AI_MODEL: ${AI_MODEL:-nvidia/nemotron-3.5-bolt-e4b}
    container_name: dopa_flutter_frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:${DOPA_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dopa_network

  # ---------------------------------------------------------------------------
  # 5. Túnel HTTPS Público por Internet (opcional con --profile internet)
  #    Permite conectar tu APK Android desde datos móviles (4G/5G) o cualquier Wi-Fi
  #    sin abrir puertos en tu router. Ver URL generada con:
  #      docker logs dopa_internet_tunnel 2>&1 | grep trycloudflare.com
  # ---------------------------------------------------------------------------
  tunnel:
    profiles: ["internet"]
    image: cloudflare/cloudflared:latest
    container_name: dopa_internet_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dopa_network

volumes:
  postgres_data:
    driver: local

networks:
  dopa_network:
    driver: bridge
